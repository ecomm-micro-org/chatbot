[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "chatbot"
version = "0.1.0"
description = "An agentic chatbot with product description generation service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "grpcio>=1.81.0",
    "grpcio-tools>=1.81.0",
    "ipython>=9.13.0",
    "langchain>=1.3.1",
    "langchain-google-genai>=4.2.3",
    "langchain-groq>=1.1.2",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.1",
    "langsmith>=0.8.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "transformers>=5.9.0",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
